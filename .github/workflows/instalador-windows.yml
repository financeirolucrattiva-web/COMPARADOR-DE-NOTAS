name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [codex/primeira-versao]
    paths:
      - '.github/workflows/instalador-windows.yml'
      - 'packaging/**'
      - 'desktop.py'
      - 'updater.py'
      - 'app.py'
      - 'comparator.py'
      - 'dominio_reader.py'
      - 'sped_reader.py'
      - 'pdf_orientation.py'
      - 'static/**'
      - 'templates/**'
      - 'exemplos/**'
      - 'requirements*.txt'

permissions:
  contents: write

concurrency:
  group: instalador-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências e testar
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falha nas dependencias' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Testes falharam' }
      - name: Compilar instalador offline
        run: |
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar NSIS' }
          }
          python packaging/build_windows.py --makensis $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar instalador' }
      - name: Instalar, usar e desinstalar no Windows
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'packaging'); from build_windows import app_version; print(app_version())"
          $installer = Get-ChildItem dist/ComparadorNotas-*-Windows-x64.exe | Select-Object -First 1
          ./packaging/test_install_windows.ps1 -Installer $installer.FullName -Version $version
      - name: Guardar instalador validado
        uses: actions/upload-artifact@v4
        with:
          name: ComparadorNotas-Windows-x64
          path: |
            dist/ComparadorNotas-*-Windows-x64.exe
            dist/ComparadorNotas-*-Windows-x64.exe.sha256
            dist/VALIDACAO-WINDOWS.txt
            dist/ComparadorNotas-Windows-x64.exe
            dist/atualizacao.json
          if-no-files-found: error
      - name: Publicar download para compartilhar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'packaging'); from build_windows import app_version; print(app_version())"
          $tag = "v$version"
          $installer = Get-ChildItem dist/ComparadorNotas-*-Windows-x64.exe | Select-Object -First 1
          $notes = @'
          Instalador offline para Windows 10/11 de 64 bits, com Python e dependências incluídos.
          Baixe o arquivo .exe e envie-o ao colega. Não é preciso instalar Python ou ter acesso de administrador.
          Inclui reconciliacao de numeros de NFS-e, revisao de numeros divergentes, atalhos e desinstalador.
          Atualiza a instalacao 0.7.1 no mesmo computador. A partir desta versao, avisa sobre novas versoes ao abrir com Internet.
          A versao 0.7.1 ja instalada precisa receber este instalador uma vez; nao possui atualizador remoto.
          Somente dados ficticios acompanham o programa. Atualizacao, reconciliacao e exportacoes testadas no Windows.
          '@
          $notes | Set-Content dist/NOTAS-RELEASE.txt
          $publishedTarget = gh release view $tag --json targetCommitish --jq .targetCommitish 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $publishedTarget -ne $env:GITHUB_SHA) { throw "Esta versao ja foi publicada de outro commit. Atualize APP_VERSION antes de gerar outro instalador." }
          if (!$exists) {
            gh release create $tag --target $env:GITHUB_SHA --title "Comparador de Notas $version - Instalador Windows" --notes-file dist/NOTAS-RELEASE.txt
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar download da versao' }
          }
          gh release upload $tag $installer.FullName "$($installer.FullName).sha256" dist/ComparadorNotas-Windows-x64.exe dist/atualizacao.json dist/VALIDACAO-WINDOWS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar instalador' }
